<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon premier site</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
        }

        main {
            padding: 50px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <header>
        <h1>Bienvenue sur mon site</h1>
    </header>

    <main>
        <h2>Bonjour !</h2>
        <p>Ceci est mon premier site web.</p>

        <button onclick="alert('Bienvenue sur mon site !')">
            Cliquez ici
        </button>
    </main>

</body>
</html>
